<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV PALACE | Luxury Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-2xl rounded-2xl overflow-hidden max-w-5xl w-full flex flex-col md:flex-row">
        <div class="bg-indigo-900 md:w-1/3 p-8 text-white flex flex-col justify-center">
            <h1 class="text-4xl font-serif font-bold mb-2">DEV PALACE</h1>
            <div class="h-1 w-12 bg-yellow-500 mb-4"></div>
            <p class="text-indigo-200 italic mb-8">Experience royalty in every stay.</p>
            
            <div class="bg-indigo-800 p-4 rounded-xl border border-indigo-700">
                <p class="text-xs uppercase tracking-widest text-indigo-300">Estimated Price</p>
                <p class="text-3xl font-bold text-yellow-500">₹<span id="displayPrice">5000</span></p>
                <p class="text-xs text-indigo-300 mt-1">*Per night stay</p>
            </div>

            <div class="bg-indigo-800 p-4 rounded-xl border border-indigo-700 mt-4">
                <p class="text-xs uppercase tracking-widest text-indigo-300">Total Stay Cost</p>
                <p class="text-3xl font-bold text-emerald-400">₹<span id="totalCost">0</span></p>
                <p class="text-xs text-indigo-300 mt-1" id="daysCount">0 nights stay</p>
            </div>
        </div>

        <div class="md:w-2/3 p-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">Reservation Form</h2>
            
            <form id="hotelBookingForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Email Address</label>
                        <input type="email" id="email" required placeholder="example@mail.com" class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Phone Number</label>
                        <input type="tel" id="phone" required placeholder="+91 0000000000" class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Check-in Date</label>
                        <input type="date" id="checkInDate" required class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Check-out Date</label>
                        <input type="date" id="checkOutDate" required class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Room Selection</label>
                        <select id="roomType" class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="5000">Royal Suite (₹5000)</option>
                            <option value="3000">Deluxe Room (₹3000)</option>
                            <option value="2000">Classic Single (₹2000)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Number of Guests</label>
                        <input type="number" id="guestCount" min="1" max="10" value="1" required class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600">Special Requests</label>
                    <textarea id="specialRequest" rows="3" placeholder="Early check-in, airport pickup, etc..." 
                    class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none resize-none bg-slate-50"></textarea>
                </div>

                <div id="errorMessage" class="hidden text-red-600 text-sm font-medium bg-red-50 p-3 rounded-lg border border-red-200"></div>
                <div id="successMessage" class="hidden text-emerald-700 text-sm font-medium bg-emerald-50 p-3 rounded-lg border border-emerald-200">
                    ✨ Welcome to DEV PALACE! Your reservation has been placed successfully.
                </div>

                <button type="submit" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-all active:scale-95">
                    Confirm Reservation
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
